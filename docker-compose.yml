services:
  postgres:
    image: postgres:latest
    container_name: db
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=phonebook
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
  backend:
    image: phone_book_api
    container_name: api
    build:
      context: ./PhoneBookAPI
      dockerfile: PhoneBookAPI/Dockerfile
    ports:
      - "7000:7000"
      - "7001:7001"
    depends_on:
      postgres:
        condition: service_healthy
  frontend:
    image: phone_book_client
    container_name: client
    build:
      context: ./PhoneBookClient
      dockerfile: Dockerfile
    ports:
      - 5000:5000
    depends_on:
      - backend
